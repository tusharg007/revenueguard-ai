# Render Blueprint for the public RevenueGuard AI API.
# PostgreSQL and Redis are external services (Neon and Upstash in the demo).
# Run the long-lived worker separately with: python -m backend.worker

services:
  - type: web
    name: revenueguard-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: N8N_APPROVAL_WEBHOOK_URL
        sync: false
      - key: HIGH_VALUE_THRESHOLD
        value: "5000000"
      - key: MAX_RETRY_ATTEMPTS
        value: "3"
      - key: COOLDOWN_HOURS
        value: "24"
      - key: QUIET_HOURS_START
        value: "21"
      - key: QUIET_HOURS_END
        value: "9"
      - key: EXPERIMENT_VARIANT_PCT
        value: "20"
