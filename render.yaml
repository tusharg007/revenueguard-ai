services:
  - type: web
    name: revenueguard-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: revenueguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: revenueguard-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: HIGH_VALUE_THRESHOLD
        value: "5000000"
      - key: MAX_RETRY_ATTEMPTS
        value: "3"
      - key: EXPERIMENT_VARIANT_PCT
        value: "20"
      - key: N8N_APPROVAL_WEBHOOK_URL
        sync: false

  - type: worker
    name: revenueguard-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m backend.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: revenueguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: revenueguard-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: HIGH_VALUE_THRESHOLD
        value: "5000000"
      - key: MAX_RETRY_ATTEMPTS
        value: "3"
      - key: EXPERIMENT_VARIANT_PCT
        value: "20"
      - key: N8N_APPROVAL_WEBHOOK_URL
        sync: false

  - type: keyvalue
    name: revenueguard-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: revenueguard-db
    plan: free
    databaseName: revenueguard
    user: revenueguard
