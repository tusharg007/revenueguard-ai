services:
  - type: web
    name: revenueguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: revenueguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: revenueguard-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false      # Set manually in Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: HIGH_VALUE_THRESHOLD
        value: "5000000"
      - key: MAX_RETRY_ATTEMPTS
        value: "3"
      - key: COOLDOWN_HOURS
        value: "24"
      - key: QUIET_HOURS_START
        value: "21"
      - key: QUIET_HOURS_END
        value: "9"
      - key: EXPERIMENT_VARIANT_PCT
        value: "20"
      - key: N8N_APPROVAL_WEBHOOK_URL
        sync: false

  - type: worker
    name: revenueguard-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m backend.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: revenueguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: revenueguard-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: HIGH_VALUE_THRESHOLD
        value: "5000000"
      - key: MAX_RETRY_ATTEMPTS
        value: "3"
      - key: EXPERIMENT_VARIANT_PCT
        value: "20"
      - key: N8N_APPROVAL_WEBHOOK_URL
        sync: false

databases:
  - name: revenueguard-db
    plan: free
    databaseName: revenueguard
    user: revenueguard

keyValueStores:
  - name: revenueguard-redis
    plan: free
