[project]
name = "revenguard-ai"
version = "0.1.0"
description = "AI-powered multi-agent revenue recovery system for Indian merchants"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- Core Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # --- AI/Agent ---
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langsmith>=0.1.0",
    "groq",
    "langchain-groq",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aiosqlite",

    # --- Redis ---
    "redis>=5.0.0",
    "certifi>=2025.1.31",

    # --- Razorpay ---
    "razorpay>=1.4.0",

    # --- Notifications ---
    "resend>=2.0.0",
    "twilio>=9.0.0",
    "httpx>=0.27.0",

    # --- ML/Stats ---
    "lightgbm",
    "xgboost",
    "shap",
    "scikit-learn",
    "joblib",
    "mabwiser",
    "scipy",
    "statsmodels",

    # --- Utilities ---
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "python-json-logger>=2.0.0",
    "faker>=28.0.0",
    "websockets>=13.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

ml = [
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[project.scripts]
revenueguard-worker = "backend.worker:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "S", "B"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
