<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">RevenueGuard AI high-level architecture flow</title>
  <desc id="desc">Razorpay webhook enters FastAPI, is persisted to PostgreSQL and a Redis queue, then reaches the recovery worker. Machine learning triage and gateway health feed an A/B experiment router. The control arm uses a fixed retry baseline; the treatment arm uses a LangGraph recovery agent and policy engine with human approval for high-value cases. Actions are executed or simulated and displayed in the Next.js dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#16243c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#020617" flood-opacity=".36"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#7dd3fc"/>
    </marker>
    <style>
      .heading{font:700 32px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}.stage{font:700 14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.5px;fill:#5eead4}.title{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.body{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.small{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#a5f3fc}.box{fill:#14233b;stroke:#40536d;stroke-width:1.5}.core{fill:#123b43;stroke:#2dd4bf;stroke-width:2}.agent{fill:#172d52;stroke:#60a5fa;stroke-width:2}.policy{fill:#382542;stroke:#c084fc;stroke-width:2}.out{fill:#2f301d;stroke:#facc15;stroke-width:2}.line{fill:none;stroke:#7dd3fc;stroke-width:2.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="940" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="7" fill="url(#accent)"/>
  <text x="52" y="63" class="heading">RevenueGuard AI — original high-level recovery flow</text>
  <text x="52" y="94" class="sub">The complete path from Razorpay intake through decisions, safety controls, execution, and the dashboard</text>

  <text x="66" y="142" class="stage">INTAKE &amp; DURABILITY</text>
  <text x="472" y="142" class="stage">RECOVERY INTELLIGENCE</text>
  <text x="994" y="142" class="stage">TREATMENT DECISION PATH</text>
  <text x="1372" y="142" class="stage">OPERATIONS</text>

  <g filter="url(#shadow)">
    <rect x="52" y="166" width="280" height="70" rx="15" class="box"/>
    <text x="76" y="198" class="title">Razorpay webhook</text>
    <text x="76" y="220" class="body">payment.failed</text>
    <rect x="52" y="272" width="280" height="92" rx="15" class="core"/>
    <text x="76" y="306" class="title">FastAPI</text>
    <text x="76" y="331" class="body">HMAC verification + idempotency</text>
    <rect x="52" y="404" width="130" height="82" rx="15" class="box"/>
    <text x="76" y="438" class="title">PostgreSQL</text>
    <text x="76" y="462" class="body">cases</text>
    <rect x="202" y="404" width="130" height="82" rx="15" class="box"/>
    <text x="231" y="438" class="title">Redis</text>
    <text x="224" y="462" class="body">queue</text>
    <rect x="52" y="532" width="280" height="78" rx="15" class="core"/>
    <text x="76" y="565" class="title">Recovery worker</text>
    <text x="76" y="588" class="body">case orchestration</text>
  </g>
  <path d="M192 236V272" class="line"/>
  <path d="M132 364V404" class="line"/>
  <path d="M252 364V404" class="line"/>
  <path d="M267 486V532" class="line"/>

  <g filter="url(#shadow)">
    <rect x="404" y="202" width="250" height="108" rx="15" class="core"/>
    <text x="428" y="236" class="title">LightGBM triage + SHAP</text>
    <text x="428" y="262" class="body">recovery probability</text>
    <text x="428" y="286" class="body">explainable reason codes</text>
    <rect x="704" y="202" width="250" height="108" rx="15" class="core"/>
    <text x="728" y="236" class="title">Gateway health</text>
    <text x="728" y="262" class="body">bank / rail telemetry</text>
    <text x="728" y="286" class="body">circuit breaker</text>
    <rect x="554" y="370" width="250" height="94" rx="15" class="box"/>
    <text x="578" y="404" class="title">A/B assignment</text>
    <text x="578" y="431" class="body">stable control / treatment</text>
    <rect x="404" y="526" width="200" height="84" rx="15" class="box"/>
    <text x="428" y="559" class="title">Control arm</text>
    <text x="428" y="584" class="body">fixed retry baseline</text>
  </g>
  <path d="M332 571H364V256H404" class="line"/>
  <path d="M332 571H680V256H704" class="line"/>
  <path d="M529 310V370" class="line"/>
  <path d="M829 310V340H679V370" class="line"/>
  <path d="M554 417H504V526" class="line"/>

  <g filter="url(#shadow)">
    <rect x="984" y="202" width="254" height="108" rx="15" class="agent"/>
    <text x="1008" y="236" class="title">LangGraph recovery agent</text>
    <text x="1008" y="262" class="body">treatment arm only</text>
    <text x="1008" y="286" class="small">structured audit trace</text>
    <rect x="984" y="370" width="74" height="70" rx="14" class="box"/>
    <text x="995" y="411" class="title">D</text>
    <rect x="1074" y="370" width="74" height="70" rx="14" class="box"/>
    <text x="1086" y="411" class="title">S</text>
    <rect x="1164" y="370" width="74" height="70" rx="14" class="box"/>
    <text x="1176" y="411" class="title">CH</text>
    <text x="985" y="468" class="small">Diagnose → strategy → channel</text>
    <rect x="984" y="526" width="254" height="108" rx="15" class="policy"/>
    <text x="1008" y="560" class="title">Policy engine</text>
    <text x="1008" y="586" class="body">limits · consent · timing</text>
    <text x="1008" y="611" class="body">gateway state · approval</text>
    <rect x="984" y="684" width="118" height="82" rx="15" class="policy"/>
    <text x="1007" y="718" class="title">HITL</text>
    <text x="1000" y="743" class="body">&gt; ₹50K</text>
    <rect x="1120" y="684" width="118" height="82" rx="15" class="out"/>
    <text x="1137" y="718" class="title">Execute</text>
    <text x="1146" y="743" class="body">or defer</text>
  </g>
  <path d="M804 417H900V256H984" class="line"/>
  <path d="M1111 310V370" class="line"/>
  <path d="M1058 405H1074" class="line"/>
  <path d="M1148 405H1164" class="line"/>
  <path d="M1201 440V486H1111V526" class="line"/>
  <path d="M1111 634V684H1043" class="line"/>
  <path d="M1111 634V658H1179V684" class="line"/>
  <path d="M1102 725H1120" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1282" y="272" width="266" height="104" rx="15" class="out"/>
    <text x="1306" y="307" class="title">Next.js dashboard</text>
    <text x="1306" y="334" class="body">control room + case detail</text>
    <text x="1306" y="358" class="body">gateway + experiments</text>
    <rect x="1282" y="460" width="266" height="104" rx="15" class="out"/>
    <text x="1306" y="495" class="title">Audit &amp; evaluation</text>
    <text x="1306" y="522" class="body">actions · approvals · lift</text>
    <text x="1306" y="546" class="body">p-value + SRM checks</text>
  </g>
  <path d="M332 318H1282" class="dash"/>
  <path d="M1238 725H1260V512H1282" class="line"/>
  <path d="M604 568H1240V512H1282" class="dash"/>

  <rect x="52" y="836" width="1496" height="58" rx="15" fill="#0f2137" stroke="#263b57"/>
  <text x="78" y="872" class="body">D = diagnosis</text>
  <text x="252" y="872" class="body">S = strategy</text>
  <text x="414" y="872" class="body">CH = channel selection</text>
  <text x="666" y="872" class="body">Control provides the baseline; treatment is the policy-governed agent path.</text>
</svg>
