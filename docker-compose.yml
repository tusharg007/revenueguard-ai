services:
  postgres:
    image: postgres:16-alpine
    container_name: revenueguard-postgres
    environment:
      POSTGRES_DB: revenueguard
      POSTGRES_USER: revenueguard
      POSTGRES_PASSWORD: revenueguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueguard -d revenueguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: revenueguard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
